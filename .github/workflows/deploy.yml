name: Build and deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package*.json'
      - 'vite.config.js'
      - 'tailwind.config.js'
      - 'postcss.config.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Update root assets with new build
        run: |
          NEW_JS=$(ls dist/assets/index-*.js | head -1)
          NEW_CSS=$(ls dist/assets/index-*.css | head -1)
          NEW_JS_NAME=$(basename "$NEW_JS")
          NEW_CSS_NAME=$(basename "$NEW_CSS")

          rm -f assets/index-*.js assets/index-*.css
          cp "dist/assets/$NEW_JS_NAME" assets/
          cp "dist/assets/$NEW_CSS_NAME" assets/

          sed -i "s|assets/index-[^\"]*\.js|assets/$NEW_JS_NAME|g" index.html
          sed -i "s|assets/index-[^\"]*\.css|assets/$NEW_CSS_NAME|g" index.html

      - name: Commit and push updated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html assets/
          git diff --staged --quiet || git commit -m "Auto-build: update JS bundle [skip ci]"
          git push
