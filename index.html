<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Somia Asim — GIS & Remote Sensing Analyst</title>
    <meta name="description" content="GIS & Remote Sensing Analyst · Spatial Data · Cartography · Research" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="./assets/index-HTz2qYUa.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DqX7bPxJ.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
(function(){
  var css = document.createElement('style');
  css.textContent = [
    '#cs-wrap{margin-bottom:2rem}',
    '#cs-banner{overflow:hidden;border-radius:16px;border:1px solid #fde68a;background:linear-gradient(to right,#fffbeb,#fff7ed);margin-bottom:1.5rem}',
    '#cs-banner-top{display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid #fef3c7}',
    '#cs-banner-top span{font-size:11px;font-family:monospace;font-weight:700;color:#d97706;text-transform:uppercase;letter-spacing:.1em}',
    '#cs-marquee{padding:10px 0;overflow:hidden}',
    '#cs-marquee-track{display:inline-flex;white-space:nowrap;animation:cs-scroll 30s linear infinite}',
    '#cs-marquee-track span{font-size:13px;font-family:monospace;color:#f59e0b;padding-right:28px}',
    '@keyframes cs-scroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}',
    '#cs-cards{display:flex;gap:16px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}',
    '#cs-cards::-webkit-scrollbar{display:none}',
    '.csc{flex-shrink:0;width:272px;border-radius:16px;border:1px solid #f1f5f9;padding:20px;display:flex;flex-direction:column;gap:10px}',
    '.csc-g{background:linear-gradient(135deg,#f0fdf4,#d1fae5)}',
    '.csc-b{background:linear-gradient(135deg,#eff6ff,#e0f2fe)}',
    '.csc-o{background:linear-gradient(135deg,#fff7ed,#fef3c7)}',
    '.csc-top{display:flex;align-items:center;justify-content:space-between}',
    '.csc-badge{font-size:11px;font-family:monospace;background:rgba(255,255,255,.75);color:#d97706;border:1px solid #fde68a;padding:2px 10px;border-radius:999px}',
    '.csc-title{font-weight:700;font-size:14px;color:#1e293b;line-height:1.4;font-family:Sora,sans-serif}',
    '.csc-desc{font-size:12px;color:#64748b;line-height:1.6;flex:1}',
    '.csc-tags{display:flex;flex-wrap:wrap;gap:4px}',
    '.csc-tag{font-size:11px;font-family:monospace;background:rgba(255,255,255,.6);color:#64748b;padding:2px 8px;border-radius:4px}'
  ].join('');
  document.head.appendChild(css);

  var marquee = 'Coming Soon · In the Lab · Research in Progress · New Posts Coming · '.repeat(6);
  var flaskSVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6m-5 0v6l-5 9a1 1 0 00.9 1.5h12.2A1 1 0 0019 18l-5-9V3"/></svg>';
  var globeSVG = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>';
  var dropSVG  = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"><path d="M12 2.69l5.66 5.66a8 8 0 11-11.31 0z"/></svg>';
  var windSVG  = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fb923c" stroke-width="1.5" stroke-linecap="round"><path d="M9.59 4.59A2 2 0 1111 8H2m10.59 11.41A2 2 0 1014 16H2m15.73-8.27A2.5 2.5 0 1119.5 12H2"/></svg>';

  function buildHTML(){
    return '<div id="cs-wrap">' +
      '<div id="cs-banner">' +
        '<div id="cs-banner-top">' + flaskSVG + '<span>In the lab &mdash; coming soon</span></div>' +
        '<div id="cs-marquee"><div id="cs-marquee-track"><span>' + marquee + '</span><span>' + marquee + '</span></div></div>' +
      '</div>' +
      '<div id="cs-cards">' +
        '<div class="csc csc-g"><div class="csc-top">' + globeSVG + '<span class="csc-badge">Coming Soon</span></div>' +
          '<div class="csc-title">Can satellites nowcast Pakistan&#8217;s agricultural growth?</div>' +
          '<div class="csc-desc">MODIS NDVI across Punjab &amp; Sindh districts (FY2001&ndash;2026) tested against World Bank GDP figures before official releases.</div>' +
          '<div class="csc-tags"><span class="csc-tag">GEE</span><span class="csc-tag">NDVI</span><span class="csc-tag">Agriculture</span></div></div>' +
        '<div class="csc csc-b"><div class="csc-top">' + dropSVG + '<span class="csc-badge">Coming Soon</span></div>' +
          '<div class="csc-title">From flood to thirst: Punjab and Sindh, 2025&ndash;26</div>' +
          '<div class="csc-desc">CHIRPS rainfall trends (1981&ndash;2025) and UNOSAT flood extents trace the swing from extreme wet to extreme dry.</div>' +
          '<div class="csc-tags"><span class="csc-tag">Flood</span><span class="csc-tag">Drought</span><span class="csc-tag">CHIRPS</span></div></div>' +
        '<div class="csc csc-o"><div class="csc-top">' + windSVG + '<span class="csc-badge">Coming Soon</span></div>' +
          '<div class="csc-title">Smoke signals: crop burning, wind, and the smog belt</div>' +
          '<div class="csc-desc">FIRMS VIIRS fire detections (2012&ndash;2026) linked to ERA5 wind trajectories and PM2.5 from Lahore and Delhi.</div>' +
          '<div class="csc-tags"><span class="csc-tag">Air Quality</span><span class="csc-tag">FIRMS</span><span class="csc-tag">ERA5</span></div></div>' +
      '</div>' +
    '</div>';
  }

  function inject(){
    var hash = window.location.hash;
    var onBlog = hash === '#/blog' || hash === '#/blog/';
    var el = document.getElementById('cs-wrap');
    if(!onBlog){ if(el) el.remove(); return; }
    if(el) return;
    var container = document.querySelector('.max-w-4xl');
    if(!container){ setTimeout(inject, 200); return; }
    var div = document.createElement('div');
    div.innerHTML = buildHTML();
    container.insertBefore(div.firstChild, container.firstChild);
  }

  window.addEventListener('hashchange', function(){ setTimeout(inject, 400); });
  setTimeout(inject, 900);
})();
    </script>
  </body>
</html>
