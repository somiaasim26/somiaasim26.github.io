    '#cs-cards-track:hover{animation-play-state:paused}',

  document.head.appendChild(css);

  var globeSVG = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>';
  var dropSVG  = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"><path d="M12 2.69l5.66 5.66a8 8 0 11-11.31 0z"/></svg>';

  var card1 = '<div class="csc csc-g"><div class="csc-top">' + globeSVG + '<span class="csc-badge">Coming Soon</span></div>' +

    '<div class="csc-tags"><span class="csc-tag">GEE</span><span class="csc-tag">NDVI</span><span class="csc-tag">Agriculture</span></div></div>';

    '</div>';
  }

  function inject(){
    var hash = window.location.hash;
    var onBlog = hash === '#/blog' || hash === '#/blog/';
    var el = document.getElementById('cs-wrap');
    if(!onBlog){ if(el) el.remove(); return; }
    if(el) return;
    var container = document.querySelector('.max-w-4xl');
    if(!container){ setTimeout(inject, 200); return; }
    var div = document.createElement('div');
    div.innerHTML = buildHTML();
    container.insertBefore(div.firstChild, container.firstChild);
  }

  window.addEventListener('hashchange', function(){ setTimeout(inject, 400); });
  setTimeout(inject, 900);
})();
